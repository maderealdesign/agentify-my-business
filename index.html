<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentify My Business | Deploy 24/7 AI Workers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="p-6 flex justify-between items-center max-w-5xl mx-auto">
        <div class="text-2xl font-bold tracking-tighter">AGENTIFY</div>
        <a href="#deploy" class="bg-blue-600 px-6 py-2 rounded-full font-bold hover:bg-blue-500">Deploy Now</a>
    </nav>

    <header class="max-w-4xl mx-auto text-center py-24 px-6">
        <h1 class="text-6xl md:text-7xl font-extrabold mb-8 leading-tight">Stop Hiring Humans. <br><span class="text-blue-500">Deploy Autonomous Workers.</span></h1>
        <p class="text-xl text-gray-400 mb-12">I've built the interface. You get the 24/7 performance. Automated lead generation, customer support, and business operations—without the HR headache.</p>
        <div class="flex justify-center gap-4">
            <a href="#deploy" class="bg-blue-600 text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-blue-500 shadow-lg shadow-blue-900/50">Get My AI Agent</a>
        </div>
    </header>

    <section id="deploy" class="max-w-3xl mx-auto py-24 px-6 bg-gray-800 rounded-3xl mb-24">
        <h2 class="text-3xl font-bold mb-8 text-center">Your Business, Automated.</h2>
        <form action="#" class="space-y-4">
            <input type="text" placeholder="Business Name" class="w-full p-4 rounded-xl bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            <input type="email" placeholder="Work Email" class="w-full p-4 rounded-xl bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            <button class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg hover:bg-blue-500">Launch My Agent</button>
        </form>
    </section>
</body>
</html>
